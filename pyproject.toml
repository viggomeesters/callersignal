[project]
name = "callersignal"
version = "0.1.0"
description = "Evidence-backed international phone-number intelligence for agents."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Viggo Meesters" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
    "phonenumbers>=9.0,<10",
]

[dependency-groups]
dev = [
  "jsonschema>=4.23,<5",
  "pytest>=8.3,<10",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
